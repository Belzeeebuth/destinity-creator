[package]
name = "musio-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Musio UI shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
