name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # The point of this job: musio-core carries all the musical correctness and has
  # no dependencies, so it builds and its 60 tests pass on a bare runner with no
  # audio stack installed at all. If this job ever needs an audio or GUI package,
  # the layering has regressed.
  core:
    name: core (no audio deps)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build curl

      - name: Fetch nlohmann/json
        run: |
          mkdir -p third_party/nlohmann
          curl -sSL -o third_party/nlohmann/json.hpp \
            https://raw.githubusercontent.com/nlohmann/json/v3.11.3/single_include/nlohmann/json.hpp

      - name: Configure
        run: cmake -B build-core -G Ninja -DMUSIO_BUILD_ENGINE=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build-core

      - name: Test
        run: ctest --test-dir build-core --output-on-failure

  engine:
    name: engine (JUCE + JACK/ALSA)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build pkg-config curl \
            libjack-jackd2-dev libasound2-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxinerama-dev libfreetype6-dev libfontconfig1-dev \
            libglu1-mesa-dev libcurl4-openssl-dev

      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: third_party/JUCE
          key: juce-8.0.6

      - name: Bootstrap dependencies
        run: ./scripts/bootstrap.sh

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # A GitHub runner has no sound server, which is exactly why the offline
      # render path exists: it exercises the real CoreEngine::process() and
      # produces a file we can assert on.
      - name: Offline render smoke test
        run: |
          E=build/engine/musio-engine_artefacts/RelWithDebInfo/musio-engine
          $E --help
          $E --list-devices || true
          $E --scan-plugins || true
          $E --render /tmp/ci.wav --seconds 4 --click --tempo 128
          python3 - <<'PY'
          import struct, sys, wave
          w = wave.open("/tmp/ci.wav", "rb")
          n, sr, ch = w.getnframes(), w.getframerate(), w.getnchannels()
          data = struct.unpack("<%dh" % (n * ch), w.readframes(n))
          w.close()

          assert sr == 48000, f"unexpected sample rate {sr}"
          assert ch == 2, f"unexpected channel count {ch}"
          assert n == 192000, f"expected 192000 frames, got {n}"

          left = data[0::ch]
          # Envelope-based click detection: a raw threshold crossing counts every
          # half cycle of the click's sine, not every click.
          W = 32
          env = [max(abs(v) for v in left[i:i + W]) / 32768 for i in range(0, len(left) - W, W)]
          onsets, armed = [], True
          for i, e in enumerate(env):
              if armed and e > 0.05:
                  onsets.append(i * W)
                  armed = False
              elif not armed and e < 0.005:
                  armed = True

          # 4 s at 128 bpm is 8.53 beats, so beats 0..8 sound: 9 clicks.
          assert len(onsets) == 9, f"expected 9 clicks, found {len(onsets)}"
          spb = sr * 60 / 128
          for k, pos in enumerate(onsets):
              ideal = round(k * spb)
              assert abs(pos - ideal) <= W, f"click {k} at {pos}, expected ~{ideal}"
          print(f"ok: {len(onsets)} clicks on the beat grid, peak={max(env):.3f}")
          PY

      # Verifies audio clip playback numerically through the whole stack:
      # decode -> SampleBuffer -> ClipScene -> CoreEngine::process -> WAV.
      - name: Audio clip end-to-end test
        run: |
          python3 scripts/e2e-clips.py \
            build/engine/musio-engine_artefacts/RelWithDebInfo/musio-engine \
            /tmp/musio-e2e

      - uses: actions/upload-artifact@v4
        with:
          name: render-smoke-test
          path: |
            /tmp/ci.wav
            /tmp/musio-e2e/out.wav
          if-no-files-found: error

  ui:
    name: ui (type-check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package.json

      - name: Install
        working-directory: ui
        run: npm install --no-audit --no-fund

      - name: Type-check
        working-directory: ui
        run: npx tsc --noEmit

  rust:
    name: ui shell (cargo check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential curl pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      # The frontendDist directory must exist for tauri-build to succeed.
      - name: Stub frontend dist
        run: mkdir -p ui/dist && echo '<!doctype html>' > ui/dist/index.html

      - name: cargo check
        working-directory: ui/src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: ui/src-tauri
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings
